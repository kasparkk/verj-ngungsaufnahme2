<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12160F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Verjüngungsaufnahme</title>
    <style>
      html, body, #root { margin: 0; height: 100%; background: #12160F; }
      * { -webkit-tap-highlight-color: transparent; }
      /* Nur die Ergebnis-Ansicht kommt in den Ausdruck bzw. ins PDF,
         und zwar schwarz auf weiss statt im dunklen Bildschirm-Design. */
      @media print {
        body * { visibility: hidden; }
        #verjuengung-druckbereich, #verjuengung-druckbereich * { visibility: visible; }
        #verjuengung-druckbereich { position: absolute; left: 0; top: 0; width: 100%; padding: 0 !important; }
        #verjuengung-druckbereich, #verjuengung-druckbereich * {
          background: #fff !important;
          color: #000 !important;
          border-color: #999 !important;
        }
        #verjuengung-druckbereich .no-print { display: none !important; }
        /* Ersatz fuer Bedienelemente, die im Ausdruck wegfallen. */
        #verjuengung-druckbereich .nur-print { display: block !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        // Lief hier schon eine Fassung? Dann ist ein Wechsel ein echtes Update.
        var hatteController = !!navigator.serviceWorker.controller;
        var laedtNeu = false;

        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });

        /* Uebernimmt eine neue Fassung, wird die Seite einmal neu geladen.
           Sonst laeuft die alte Oberflaeche weiter, bis die App vollstaendig
           geschlossen wird - genau das hat frueher dazu gefuehrt, dass
           Aenderungen auf dem Geraet erst viel spaeter ankamen. */
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (!hatteController || laedtNeu) return;
          laedtNeu = true;
          location.reload();
        });
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12160F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Verjüngungsaufnahme</title>
    <style>
      html, body, #root { margin: 0; height: 100%; background: #12160F; }
      * { -webkit-tap-highlight-color: transparent; }
      /* Nur die Ergebnis-Ansicht kommt in den Ausdruck bzw. ins PDF,
         und zwar schwarz auf weiss statt im dunklen Bildschirm-Design. */
      @media print {
        body * { visibility: hidden; }
        #verjuengung-druckbereich, #verjuengung-druckbereich * { visibility: visible; }
        #verjuengung-druckbereich { position: absolute; left: 0; top: 0; width: 100%; padding: 0 !important; }
        #verjuengung-druckbereich, #verjuengung-druckbereich * {
          background: #fff !important;
          color: #000 !important;
          border-color: #999 !important;
        }
        #verjuengung-druckbereich .no-print { display: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        // Lief hier schon eine Fassung? Dann ist ein Wechsel ein echtes Update.
        var hatteController = !!navigator.serviceWorker.controller;
        var laedtNeu = false;
        var registrierung = null;
        var zuletztGefragt = 0;

        /* Nachsehen, ob eine neue Fassung bereitliegt.

           Das Registrieren beim Laden allein reicht nicht: Eine vom
           Startbildschirm gestartete App wird selten wirklich beendet, sie
           wandert nur in den Hintergrund. Ohne Seitenladen fragt niemand
           nach - man laeuft dann tagelang auf einer alten Fassung, ohne es
           zu merken.

           Gefragt wird deshalb, sobald die App wieder nach vorne kommt oder
           Netz zurueckkehrt - beides sind natuerliche Momente zum Neuladen,
           anders als mitten im Zaehlen. Hoechstens einmal pro Minute, damit
           das Hin und Her zwischen Apps keine Anfragenflut ausloest. */
        function nachsehen() {
          if (!registrierung) return;
          var jetzt = Date.now();
          if (jetzt - zuletztGefragt < 60000) return;
          zuletztGefragt = jetzt;
          registrierung.update().catch(function () {});
        }

        window.addEventListener("load", function () {
          /* updateViaCache "none": sw.js selbst nie aus dem Browsercache
             beantworten. Netlify schickt zwar must-revalidate, aber das
             haengt am Server - hier steht es unabhaengig davon fest. */
          navigator.serviceWorker
            .register("/sw.js", { updateViaCache: "none" })
            .then(function (r) {
              registrierung = r;
              zuletztGefragt = Date.now();
            })
            .catch(function () {});
        });

        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") nachsehen();
        });
        window.addEventListener("online", nachsehen);

        /* Uebernimmt eine neue Fassung, wird die Seite einmal neu geladen.
           Sonst laeuft die alte Oberflaeche weiter, bis die App vollstaendig
           geschlossen wird - genau das hat frueher dazu gefuehrt, dass
           Aenderungen auf dem Geraet erst viel spaeter ankamen. */
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (!hatteController || laedtNeu) return;
          laedtNeu = true;
          location.reload();
        });
      }
    </script>
  </body>
</html>

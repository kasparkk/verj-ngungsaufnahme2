# Haelt die Supabase-Datenbank wach.
#
# Der kostenlose Tarif legt eine Datenbank schlafen, wenn sie eine Weile
# keine Anfrage bekommen hat. Aufgeweckt werden muss sie dann von Hand im
# Supabase-Konto - das ist im Gelaende der denkbar unpassendste Zeitpunkt.
#
# Am 20.09.2026 ist das Projekt trotzdem pausiert worden, obwohl zweimal
# die Woche ein Lauf durchlief. Der Grund war vermutlich nicht die
# Haeufigkeit, sondern die Art der Anfrage: Der Ablauf hat nur GELESEN.
#
# Supabase nennt als Schwelle "1 week of inactivity". Gerechnet ab dem
# letzten SCHREIBZUGRIFF der App (11.09. 14:36 UTC) waren es bis zur
# Pause (20.09. 03:42 UTC) acht Tage - das passt. Gerechnet ab dem
# letzten Lesezugriff waren es siebzehn Stunden - das passt auf nichts.
# Reines Lesen scheint die Uhr also nicht zurueckzusetzen.
#
# Deshalb SCHREIBT der Ablauf jetzt: ein Zeitstempel in die Tabelle
# "wachhalten", die genau eine Zeile hat und keine Nutzdaten. Und das
# alle sechs Stunden statt zweimal die Woche, damit ein ausgefallener
# Lauf nichts ausmacht. Vier Laeufe am Tag sind rund zwei Minuten
# Rechenzeit im Monat, weit unter dem kostenlosen Kontingent.
#
# Ob die Annahme stimmt, zeigt sich erst in der Woche nach dem
# 27.09.2026. Pausiert es dann wieder, liegt es nicht am Wachhalten, und
# es hilft nur ein bezahlter Tarif oder ein anderer Ort fuer die Daten.
#
# Der Schluessel steht offen im Text und ist kein Versehen: es ist derselbe
# oeffentliche Schluessel, der ohnehin in der ausgelieferten App steht. Er
# darf nur das, was die Datenbank jedem erlaubt.

name: Datenbank wachhalten

on:
  schedule:
    # Alle sechs Stunden. GitHub verschiebt Zeitplaene auf den freien
    # Laeufern gern um eine Stunde und laesst unter Last auch mal einen
    # aus - bei vier Terminen am Tag faellt das nicht ins Gewicht.
    - cron: "0 */6 * * *"
  # Zum Ausprobieren auch von Hand ausloesbar (Actions -> Run workflow).
  workflow_dispatch:

jobs:
  anfragen:
    runs-on: ubuntu-latest
    steps:
      - name: Zeitstempel schreiben
        run: |
          URL="https://xrrcuapiugwgqxxatkiq.supabase.co/rest/v1/wachhalten?id=eq.1"
          KEY="sb_publishable_kcP8-40mEnwPGuFwVGigKA_b5swelLm"

          # Drei Versuche: eine einzelne Stoerung soll nicht gleich als
          # Fehlschlag gemeldet werden.
          for versuch in 1 2 3; do
            code=$(curl -s -o antwort.txt -w '%{http_code}' -X PATCH "$URL" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=representation" \
              -d '{"zuletzt":"now()","woher":"GitHub"}')
            echo "Versuch $versuch: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Geschrieben: $(cat antwort.txt)"
              exit 0
            fi
            sleep 30
          done

          echo "::error::Datenbank antwortet nicht (zuletzt HTTP $code)."
          echo "Sie schlaeft vermutlich und muss auf supabase.com einmal"
          echo "ueber Restore geweckt werden."
          head -c 300 antwort.txt
          exit 1

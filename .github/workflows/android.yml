name: Android-App bauen

# Baut bei jedem Push auf den Zweig capacitor-android (oder per Hand unter "Actions")
# eine installierbare Test-APK. Die Website auf Netlify ist davon nicht betroffen.
on:
  push:
    branches: [capacitor-android]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Abhängigkeiten
        run: |
          npm ci
          npm install --no-save @capacitor/core@8.6.2 @capacitor/android@8.6.2 @capacitor/cli@8.6.2

      - name: Web-App bauen und ins Android-Projekt kopieren
        run: |
          npm run build
          npx cap sync android

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: verjuengung-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
